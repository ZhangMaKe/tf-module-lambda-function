#workflow to test terraform code
name: Terraform CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
    
        - name: Run Trivy on Terraform Code
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: config
            scan-ref: .
            exit-code: 1